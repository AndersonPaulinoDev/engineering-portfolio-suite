openapi: 3.1.0
info: {title: ScanStock API, version: 0.1.0}
servers: [{url: http://localhost:8082}]
paths:
  /api/v1/auth/login:
    post: {responses: {"200": {description: Authenticated}}}
  /api/v1/products:
    get: {security: [{bearerAuth: []}], responses: {"200": {description: Stock view}}}
    post: {security: [{bearerAuth: []}], responses: {"200": {description: Product created}}}
  /api/v1/transactions:
    get: {security: [{bearerAuth: []}], responses: {"200": {description: Ledger entries}}}
    post: {security: [{bearerAuth: []}], responses: {"200": {description: Transaction recorded}, "409": {description: Rejected transaction}}}
  /api/v1/sync:
    post: {security: [{bearerAuth: []}], responses: {"200": {description: Offline operation results}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer}}
