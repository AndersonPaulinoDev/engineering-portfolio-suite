services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scanstock
      POSTGRES_PASSWORD: scanstock
      POSTGRES_DB: scanstock
    ports:
      - "5434:5432"
    volumes:
      - scanstock_pg:/var/lib/postgresql/data
      - ./api/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanstock -d scanstock"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: golang:1.27-alpine
    working_dir: /app
    command: ["go", "run", "-tags", "postgres", "./cmd/server"]
    volumes:
      - ./api:/app
    environment:
      ADDR: :8082
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET in .env before starting Compose}"
      DATABASE_URL: postgres://scanstock:scanstock@postgres:5432/scanstock?sslmode=disable
      DEMO_MODE: "${DEMO_MODE:-false}"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  scanstock_pg: {}
