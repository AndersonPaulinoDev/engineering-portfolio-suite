openapi: 3.1.0
info: {title: OpsTrack API, version: 0.1.0}
servers: [{url: http://localhost:8081}]
paths:
  /api/v1/auth/login:
    post: {responses: {"200": {description: Authenticated}}}
  /api/v1/work-orders:
    get: {security: [{bearerAuth: []}], responses: {"200": {description: Assigned work orders}}}
  /api/v1/work-orders/{id}/transition:
    post:
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {"200": {description: State transitioned}, "409": {description: Invalid transition or conflict}}
  /api/v1/sync:
    post: {security: [{bearerAuth: []}], responses: {"200": {description: Offline operation results}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer}}
